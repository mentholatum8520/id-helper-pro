name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Project and Build
        run: |
          # 自動尋找包含 build.gradle.kts 的資料夾
          PROJECT_PATH=$(find . -name "settings.gradle.kts" -exec dirname {} + | head -n 1)
          echo "找到專案路徑: $PROJECT_PATH"
          cd "$PROJECT_PATH"
          
          # 確保 Gradle 有權限執行
          chmod +x gradlew || true
          
          # 直接使用系統 Gradle 進行編譯
          sudo apt-get install -y gradle
          gradle assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: id-helper-pro-LOVE-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
