name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0
      - name: Build APK
        run: |
          # 進入你上傳的資料夾路徑
          cd id_helper_pro_project/id-helper-pro-LOVE
          chmod +x gradlew || true
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: id-helper-pro-LOVE-apk
          path: id_helper_pro_project/id-helper-pro-LOVE/app/build/outputs/apk/debug/app-debug.apk
